name: Publicar launcher Android 0.1.6

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-android-0-1-6.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-android-0-1-6
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: android-0.1.6
      APK: Bodriosafio_Launcher_Android_0_1_6.apk
    steps:
      - name: Recuperar el APK firmado y comprobar su integridad
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import concurrent.futures
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.request
          import zipfile
          from pathlib import Path

          # Original APK transferred with the connected GitHub API. These are
          # Git object IDs, not credentials. No game APK or signing key is included.
          segments = [
              "80a1139fa981b5c7c5499d8a5fc56925ee3b0c1f",
              "5cab891808b3fccd85269ebc1b22c711d20c511f",
              "fd0728ba616fdc9648a7837da7c1864759a92a68",
              "c28569aaab6d917ca54583892bf790bfba76fd20",
              "5f731bd4afeae289011a93bbf7cdc9cd38b01ab2",
              "2e213b3d0d85928a527fb0c6bbc9461398fe3ffc",
              "a6df7ccb654bfb118b816e8574d7bc71c8e2fa0b",
              "bd28c753c86483ad8ee100aacd0937f9c91b8a4c",
          ]
          expected = "48d29d3c56bec1f925b655ff5a8b8dbfa59113dbfd3067e07d481c1385fe2494"
          apk = Path(os.environ["APK"])
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "alanbustamorag-source/panconqueso":
              raise SystemExit("Repositorio inesperado")

          def fetch(sha):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Bodriosafio-release",
                  },
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  payload = json.load(response)
              if payload.get("sha") != sha or payload.get("encoding") != "base64":
                  raise ValueError("Objeto Git inesperado")
              data = base64.b64decode("".join(payload["content"].split()), validate=True)
              header = ("blob " + str(len(data)) + "\0").encode()
              if hashlib.sha1(header + data).hexdigest() != sha:
                  raise ValueError("Segmento incompleto")
              return data

          state = subprocess.run(
              ["gh", "release", "view", os.environ["TAG"], "--json", "assets"],
              text=True, capture_output=True,
          )
          existing = json.loads(state.stdout) if state.returncode == 0 else {}
          if any(item["name"] == apk.name for item in existing.get("assets", [])):
              subprocess.run(
                  ["gh", "release", "download", os.environ["TAG"],
                   "--pattern", apk.name, "--dir", str(Path.cwd())], check=True,
              )
              Path("asset-already-present").touch()
          else:
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  with apk.open("wb") as output:
                      for data in pool.map(fetch, segments):
                          output.write(data)

          if apk.stat().st_size != 29817109:
              raise SystemExit("El tamaño del APK no coincide")
          if hashlib.sha256(apk.read_bytes()).hexdigest() != expected:
              raise SystemExit("El SHA-256 del APK no coincide")
          with zipfile.ZipFile(apk) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("APK corrupto")
              if any(Path(name).name.lower() in
                     ("libminecraftpe.so", "minecraft.windows.exe")
                     for name in archive.namelist()):
                  raise SystemExit("No se publican binarios del juego")
              addon = archive.read("assets/bodriosafio/Bodriosafio_0_3_15.mcaddon")
              if hashlib.sha256(addon).hexdigest() != "900687d53f42d257fcd0642cde8a49952aad696e42b99b467c747879f5e255e3":
                  raise SystemExit("El addon integrado no coincide")

          sdk = os.environ.get("ANDROID_HOME") or os.environ.get("ANDROID_SDK_ROOT")
          signers = sorted(Path(sdk).glob("build-tools/*/apksigner")) if sdk else []
          if not signers:
              raise SystemExit("No se encontró el verificador oficial de firmas Android")
          signature = subprocess.run(
              [str(signers[-1]), "verify", "--verbose", "--print-certs", str(apk)],
              check=True, text=True, capture_output=True,
          ).stdout
          digests = {
              digest.lower()
              for line in signature.splitlines() if "signer" in line.lower()
              for digest in re.findall(r"certificate SHA-256 digest:\s*([0-9a-fA-F]{64})", line)
          }
          if not re.search(r"^Number of signers:\s*1\s*$", signature, re.MULTILINE | re.IGNORECASE):
              raise SystemExit("La APK debe tener un solo firmante")
          print("Certificados Android encontrados: " + ", ".join(sorted(digests)))
          if digests != {"144b63f97269476b81895a3de9ac6ee3172cedde94399f8dae7c2bc4279beb47"}:
              print(signature)
              raise SystemExit("Certificado Android inesperado")
          print("Firma Android verificada con apksigner; certificado de Bodriosafío correcto.")

          notes = (
              "Launcher Android 0.1.6 (versionCode 10012), ARM64, Android 9 o superior.\n\n"
              "Incluye el addon 0.3.15 y consulta el canal de actualizaciones de este repositorio. "
              "La instalación de una actualización requiere la confirmación de Android.\n\n"
              "APK firmado con el certificado habitual de Bodriosafío. No incluye el motor de Minecraft. "
              "La publicación y las comprobaciones de integridad no sustituyen una prueba dentro del juego.\n\n"
              "SHA-256: `" + expected + "`\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print("APK verificado: 29.817.109 bytes; SHA-256 correcto; addon integrado correcto.")
          PY

      - name: Publicar la descarga en Releases
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            if [ ! -f asset-already-present ]; then
              gh release upload "$TAG" "$APK"
            fi
          else
            gh release create "$TAG" "$APK" --draft --target "$GITHUB_SHA" \
              --title "Bodriosafío Android 0.1.6" --notes-file release-notes.md
          fi
          gh release edit "$TAG" --draft=false
